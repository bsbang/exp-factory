name: Publish Templates
on:
  push:
    paths:
      - 'packages/templates/**'
  workflow_dispatch:
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 【entity-PyGithub¦canonical_name=GitHub】 requests
      - env:
          FACTORY_GH_TOKEN: ${{ secrets.FACTORY_GH_TOKEN }}
        run: python packages/core/scripts/publish_templates.py
