name: Create Product Repo
on:
  workflow_dispatch:
    inputs:
      idea:
        description: 'idea'
        required: true
        default: 'brick breaker booster'
      product_name:
        description: 'repo name'
        required: true
        default: 'brick-breaker-booster'
jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install PyGithub
      - env:
          FACTORY_GH_TOKEN: ${{ secrets.FACTORY_GH_TOKEN }}
          IDEA: ${{ inputs.idea }}
          PRODUCT_NAME: ${{ inputs.product_name }}
        run: python packages/core/scripts/create_product.py
